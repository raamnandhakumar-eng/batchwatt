ext><text x="24" y="340" font-size="15"><title>ORD-1 · 250 ml ghee</title>ORD-1 · 250 ml ghee</text><text x="24" y="361" font-size="14" fill="#66645c">Urgent · Today</text><rect x="340" y="324" width="560" height="24" rx="3" fill="#d8663c"/><rect x="340" y="324" width="560.00" height="24" fill="#2f6f4e"/><text x="340" y="370" font-size="14">Covered 120 · Short 0 · Ordered 120 units</text></g></svg>