name: Planner checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo
      - run: node scripts/export-energy-plan.js samples/energy-demo.json output/energy-demo
      - run: node scripts/build.js
